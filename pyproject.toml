[build-system]
requires = ["flit_core>=3.12"]
build-backend = "flit_core.buildapi"

[project]
name = "ensemble_eeg"
version = "0.2.0"
dependencies = [
    "fire",
    "numpy",
    "defusedxml",
    "dateparser",
]
requires-python = ">=3.10"
authors = [
  { name="Bauke van der Velde" },
]
maintainers = [
  { name="Aymeric Gaudin" },
  { name="Dimitri Papadopoulos Orfanos" },
]
description = "Package used to analyze preprocess EDF files for the ENSEMBLE study"
readme = "README.md"
license = "GPL-3.0"
license-files = [ "LICENSE", "NOTICE" ]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
anonymize_eeg_ensemble = "ensemble_eeg:_anonymize_eeg_ensemble_main"

[project.urls]
Repository = "https://github.com/ensemble2/ensemble_eeg"

[tool.ruff.lint]
extend-select = [
    "UP",
    "I",
    "B",
    "C4",
    "PIE",
    "PYI",
    "SIM",
    "PGH",
    "FLY",
    "PERF",
    "FURB",
    "RUF",
]
ignore = [
	"B028",
    "DTZ001",
	"PYI024",
	"SIM115",
	"RUF005",
    "TRY002",
]
